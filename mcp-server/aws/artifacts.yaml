AWSTemplateFormatVersion: '2010-09-09'
Description: Private build artifacts for the Revember MCP Lambda deployment.
Metadata:
  AWSToolsMetrics:
    AWSAgentToolkit: aws-cloudformation@2
Resources:
  Artifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Metadata:
      com.aws.cloudformation.Context:
        why: Store versioned Lambda ZIPs for reproducible deployments and rollback.
        must: [Block public access, Encrypt artifacts, Retain on stack deletion]
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
  ArtifactsPolicy:
    Type: AWS::S3::BucketPolicy
    Metadata:
      com.aws.cloudformation.Context:
        why: Require encryption in transit for all artifact operations.
        must: [Deny non-TLS requests]
    Properties:
      Bucket: !Ref Artifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt Artifacts.Arn, !Sub '${Artifacts.Arn}/*']
            Condition:
              Bool:
                aws:SecureTransport: 'false'
Outputs:
  BucketName:
    Description: Private artifact bucket for the MCP service stack.
    Value: !Ref Artifacts
