name: Bug report
description: Tell us what went wrong in Revember.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Revember. Please do not include personal learning content, secrets, or full local file paths.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Choose ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revember revision
      description: Share the app version or commit SHA if available.
  - type: dropdown
    id: macos
    attributes:
      label: macOS version
      options:
        - macOS 14
        - macOS 15
        - macOS 16 or later
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Remove personal learning data, tokens, and local paths before attaching anything.
