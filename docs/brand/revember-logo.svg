<svg xmlns="http://www.w3.org/2000/svg" width="512" height="160" viewBox="0 0 512 160" role="img" aria-labelledby="title desc">
  <title id="title">Revember logo</title>
  <desc id="desc">A compact Revember wordmark with an unboxed angular revision mark and a cyan v accent.</desc>
  <g fill="none" fill-rule="evenodd">
    <rect width="512" height="160" rx="28" fill="#090A0B"/>
    <g transform="translate(28 32)" stroke-linecap="round" stroke-linejoin="round">
