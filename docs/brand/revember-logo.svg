    </g>
    <text x="148" y="76" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', Inter, sans-serif" font-size="52" font-weight="650">
      <tspan fill="#F4F7F8">Re</tspan><tspan fill="#57D1DB">v</tspan><tspan fill="#F4F7F8">ember</tspan>
