    <text x="151" y="106" fill="#9DA3AD" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, sans-serif" font-size="16" font-weight="500" letter-spacing="1.4">FUNDAMENTALS COCKPIT</text>
