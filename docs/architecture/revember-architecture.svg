<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1160" viewBox="0 0 1720 1160" role="img" aria-labelledby="title desc">
  <title id="title">Revember v2 Architecture</title>
  <desc id="desc">Architecture diagram for manual inspection and development of the Revember v2 macOS SwiftUI app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12161c"/>
      <stop offset="1" stop-color="#181d25"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3dd6d0"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f4b752"/>
    </marker>
    <marker id="arrowMagenta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#de4f86"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .panel { fill: #202833; stroke: #344252; stroke-width: 1.3; filter: url(#softShadow); }
      .panel2 { fill: #1a222c; stroke: #2d3a49; stroke-width: 1.1; }
      .panel3 { fill: #151d26; stroke: #314050; stroke-width: 1.1; }
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", Arial, sans-serif; fill: #f3f6f8; }
      .subtitle { font: 500 15px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill: #9fb0c2; }
      .section { font: 700 16px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill: #dfe8ee; letter-spacing: 0.2px; }
      .label { font: 650 18px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill: #f0f4f7; }
      .small { font: 500 13px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill: #b9c7d3; }
      .tiny { font: 500 12px -apple-system, BlinkMacSystemFont, "SF Pro Text", Arial, sans-serif; fill: #98aabc; }
      .code { font: 500 13px "SF Mono", Menlo, Consolas, monospace; fill: #c9d5df; }
      .codeStrong { font: 700 13px "SF Mono", Menlo, Consolas, monospace; fill: #f3f6f8; }
      .cyan { fill: #3dd6d0; }
      .amber { fill: #f4b752; }
      .magenta { fill: #de4f86; }
      .green { fill: #7ddf9b; }
      .muted { fill: #7f93a6; }
      .lineCyan { fill: none; stroke: #3dd6d0; stroke-width: 2.2; marker-end: url(#arrowCyan); }
      .lineAmber { fill: none; stroke: #f4b752; stroke-width: 2.2; marker-end: url(#arrowAmber); }
      .lineMagenta { fill: none; stroke: #de4f86; stroke-width: 2.2; marker-end: url(#arrowMagenta); }
      .lineMuted { fill: none; stroke: #526476; stroke-width: 1.8; stroke-dasharray: 6 6; }
      .pill { fill: #101820; stroke: #314050; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1720" height="1160"/>

  <text class="title" x="58" y="62">Revember v2 Architecture</text>
  <text class="subtitle" x="60" y="92">Manual inspection map for the macOS SwiftUI app, local knowledge files, progress persistence, and test seams.</text>

  <rect class="pill" x="1262" y="38" width="402" height="46" rx="10"/>
  <text class="codeStrong" x="1284" y="66">Open in Xcode: revember_v2/Revember.xcodeproj</text>

  <!-- Repository shell -->
  <rect class="panel" x="52" y="126" width="390" height="236" rx="12"/>
  <text class="section" x="82" y="162">1. Project Entry Points</text>
  <circle class="cyan" cx="86" cy="199" r="5"/>
  <text class="codeStrong" x="104" y="204">Revember.xcodeproj</text>
  <text class="tiny" x="104" y="224">Normal Xcode wrapper with shared schemes</text>
  <circle class="amber" cx="86" cy="258" r="5"/>
  <text class="codeStrong" x="104" y="263">Package.swift</text>
  <text class="tiny" x="104" y="283">SwiftPM build/test path remains valid</text>
  <circle class="green" cx="86" cy="317" r="5"/>
  <text class="codeStrong" x="104" y="322">script/build_and_run.sh</text>
  <text class="tiny" x="104" y="342">Codex/local launch path builds app bundle</text>

  <!-- Xcode targets -->
  <rect class="panel" x="498" y="126" width="440" height="236" rx="12"/>
  <text class="section" x="528" y="162">2. Xcode / SwiftPM Targets</text>
  <rect class="panel2" x="530" y="190" width="160" height="72" rx="10"/>
  <text class="label" x="558" y="220">Revember</text>
  <text class="tiny" x="552" y="242">macOS app target</text>
  <rect class="panel2" x="708" y="190" width="190" height="72" rx="10"/>
  <text class="label" x="732" y="220">RevemberV2Core</text>
  <text class="tiny" x="744" y="242">app logic + views</text>
  <rect class="panel2" x="618" y="286" width="210" height="72" rx="10"/>
  <text class="label" x="656" y="316">RevemberV2Tests</text>
  <text class="tiny" x="656" y="338">loader, progress, graph</text>

  <!-- Runtime launch -->
  <rect class="panel" x="994" y="126" width="610" height="236" rx="12"/>
  <text class="section" x="1024" y="162">3. Runtime Launch and Root State</text>
  <rect class="panel2" x="1028" y="190" width="158" height="76" rx="10"/>
  <text class="codeStrong" x="1052" y="222">main.swift</text>
  <text class="tiny" x="1048" y="244">calls App.main()</text>
  <rect class="panel2" x="1230" y="190" width="196" height="76" rx="10"/>
  <text class="codeStrong" x="1260" y="222">RevemberV2App</text>
  <text class="tiny" x="1248" y="244">creates AppStore</text>
  <rect class="panel2" x="1470" y="190" width="154" height="76" rx="10"/>
  <text class="codeStrong" x="1500" y="222">ContentView</text>
  <text class="tiny" x="1494" y="244">injects store</text>
  <path class="lineCyan" d="M1186 228 C1204 228 1212 228 1228 228"/>
  <path class="lineCyan" d="M1426 228 C1445 228 1452 228 1468 228"/>
  <rect class="panel3" x="1136" y="292" width="374" height="48" rx="9"/>
  <text class="code" x="1162" y="322">@StateObject AppStore -> .environmentObject(store)</text>

  <!-- SwiftUI layer -->
  <rect class="panel" x="52" y="424" width="560" height="372" rx="12"/>
  <text class="section" x="82" y="460">4. SwiftUI Presentation Layer</text>
  <rect class="panel2" x="84" y="492" width="206" height="88" rx="10"/>
  <text class="codeStrong" x="108" y="524">ContentView</text>
  <text class="tiny" x="108" y="546">NavigationSplitView</text>
  <text class="tiny" x="108" y="566">Reload + Settings toolbar</text>
  <rect class="panel2" x="334" y="492" width="210" height="88" rx="10"/>
  <text class="codeStrong" x="366" y="524">SidebarView</text>
  <text class="tiny" x="366" y="546">topic list</text>
  <text class="tiny" x="366" y="566">progress summaries</text>
  <rect class="panel2" x="84" y="620" width="206" height="104" rx="10"/>
  <text class="codeStrong" x="106" y="652">TopicDetailView</text>
  <text class="tiny" x="106" y="674">segmented modes:</text>
  <text class="tiny" x="106" y="696">Concept Map / Graph / Check-In</text>
  <rect class="panel2" x="334" y="620" width="210" height="104" rx="10"/>
  <text class="codeStrong" x="366" y="652">Mode Views</text>
  <text class="tiny" x="366" y="674">ConceptReviewView</text>
  <text class="tiny" x="366" y="694">KnowledgeGraphView</text>
  <text class="tiny" x="366" y="714">QuizView</text>
  <path class="lineCyan" d="M290 536 C308 536 314 536 332 536"/>
  <path class="lineCyan" d="M187 580 C187 594 187 604 187 618"/>
  <path class="lineCyan" d="M290 672 C308 672 314 672 332 672"/>
  <rect class="panel3" x="84" y="748" width="460" height="44" rx="9"/>
  <text class="code" x="112" y="776">All views read state from AppStore via @EnvironmentObject</text>

  <!-- AppStore core -->
  <rect class="panel" x="668" y="424" width="466" height="372" rx="12"/>
  <text class="section" x="698" y="460">5. State and Behavior Hub</text>
  <rect class="panel2" x="716" y="492" width="372" height="218" rx="12"/>
  <text class="label" x="810" y="532">AppStore</text>
  <text class="code" x="750" y="570">@Published topics</text>
  <text class="code" x="750" y="596">@Published selectedTopicID</text>
  <text class="code" x="750" y="622">@Published progress</text>
  <text class="code" x="750" y="648">@Published errorMessage</text>
  <text class="code" x="750" y="674">@Published knowledgeRootPath</text>
  <rect class="panel3" x="716" y="736" width="372" height="56" rx="9"/>
  <text class="code" x="744" y="762">answer() -> ProgressRecord.recordAnswer()</text>
  <text class="tiny" x="744" y="782">wrong answers increase weakConceptIDs</text>

  <!-- Services -->
  <rect class="panel" x="1190" y="424" width="514" height="372" rx="12"/>
  <text class="section" x="1220" y="460">6. Services and Persistence</text>
  <rect class="panel2" x="1232" y="492" width="204" height="104" rx="10"/>
  <text class="codeStrong" x="1260" y="528">KnowledgeLoader</text>
  <text class="tiny" x="1260" y="550">loads topics/*.json</text>
  <text class="tiny" x="1260" y="570">decodes KnowledgeTopic</text>
  <rect class="panel2" x="1482" y="492" width="216" height="104" rx="10"/>
  <text class="codeStrong" x="1508" y="528">ProgressFileStore</text>
  <text class="tiny" x="1508" y="550">loads/saves progress</text>
  <text class="tiny" x="1508" y="570">pretty JSON, atomic write</text>
  <rect class="panel3" x="1232" y="638" width="204" height="90" rx="10"/>
  <text class="codeStrong" x="1266" y="670">RevemberKnowledge</text>
  <text class="tiny" x="1266" y="692">notes/*.md source</text>
  <text class="tiny" x="1266" y="712">topics/*.json app data</text>
  <rect class="panel3" x="1482" y="638" width="216" height="90" rx="10"/>
  <text class="codeStrong" x="1508" y="670">progress.json</text>
  <text class="tiny" x="1508" y="692">~/Library/Application Support</text>
  <text class="tiny" x="1508" y="712">/RevemberV2/progress.json</text>
  <path class="lineAmber" d="M1334 596 C1334 612 1334 622 1334 636"/>
  <path class="lineAmber" d="M1590 596 C1590 612 1590 622 1590 636"/>
  <text class="tiny" x="1240" y="770">Change JSON shape? Update models, loader tests, and sample topic files together.</text>

  <!-- Model layer -->
  <rect class="panel" x="52" y="858" width="530" height="250" rx="12"/>
  <text class="section" x="82" y="894">7. Data Models</text>
  <rect class="panel2" x="84" y="926" width="224" height="138" rx="10"/>
  <text class="codeStrong" x="116" y="958">KnowledgeModels.swift</text>
  <text class="tiny" x="116" y="980">KnowledgeTopic</text>
  <text class="tiny" x="116" y="1000">Concept</text>
  <text class="tiny" x="116" y="1020">Gap</text>
  <text class="tiny" x="116" y="1040">Question + AnswerChoice</text>
  <rect class="panel2" x="342" y="926" width="214" height="138" rx="10"/>
  <text class="codeStrong" x="368" y="958">ProgressModels.swift</text>
  <text class="tiny" x="368" y="980">ProgressRecord</text>
  <text class="tiny" x="368" y="1000">TopicProgress</text>
  <text class="tiny" x="368" y="1020">QuestionProgress</text>
  <text class="tiny" x="368" y="1040">weakConceptIDs</text>

  <!-- Graph feature -->
  <rect class="panel" x="636" y="858" width="442" height="250" rx="12"/>
  <text class="section" x="666" y="894">8. Graph Feature</text>
  <rect class="panel2" x="676" y="926" width="342" height="138" rx="10"/>
  <text class="codeStrong" x="706" y="958">KnowledgeGraphModels.swift</text>
  <text class="tiny" x="706" y="980">Builds nodes from concepts, gaps, questions</text>
  <text class="tiny" x="706" y="1000">Builds links: concept ladder, gap -> concept, question -> concept</text>
  <text class="tiny" x="706" y="1020">KnowledgeGraphLayout computes stable positions</text>
  <text class="tiny" x="706" y="1040">KnowledgeGraphView renders the interactive map</text>

  <!-- Inspection checklist -->
  <rect class="panel" x="1134" y="858" width="570" height="250" rx="12"/>
  <text class="section" x="1164" y="894">9. Manual Inspection Checklist</text>
  <circle class="cyan" cx="1172" cy="936" r="5"/>
  <text class="small" x="1192" y="941">App does not show topics: inspect RevemberKnowledge/topics/*.json and KnowledgeLoader.</text>
  <circle class="amber" cx="1172" cy="974" r="5"/>
  <text class="small" x="1192" y="979">Progress looks wrong: inspect AppStore.answer(), ProgressRecord, and progress.json.</text>
  <circle class="magenta" cx="1172" cy="1012" r="5"/>
  <text class="small" x="1192" y="1017">UI mode issue: start at TopicDetailView, then the selected mode view.</text>
  <circle class="green" cx="1172" cy="1050" r="5"/>
  <text class="small" x="1192" y="1055">Graph issue: inspect KnowledgeGraphModels, KnowledgeGraphView, and graph tests.</text>

  <!-- Cross-layer arrows -->
  <path class="lineCyan" d="M938 244 C966 244 972 244 992 244"/>
  <path class="lineCyan" d="M544 670 C604 670 626 670 714 670"/>
  <path class="lineCyan" d="M1088 560 C1142 560 1164 542 1230 542"/>
  <path class="lineAmber" d="M1088 642 C1150 642 1170 548 1480 548"/>
  <path class="lineAmber" d="M1436 684 C1454 684 1462 684 1480 684"/>
  <path class="lineMagenta" d="M716 762 C636 802 528 872 448 924"/>
  <path class="lineCyan" d="M902 710 C902 788 864 828 864 924"/>
  <path class="lineMuted" d="M318 362 C318 386 318 398 318 422"/>
  <path class="lineMuted" d="M718 362 C718 386 718 398 718 422"/>
  <path class="lineMuted" d="M1298 362 C1298 386 1298 398 1298 422"/>

  <!-- Footer legend -->
  <rect class="pill" x="58" y="1120" width="774" height="32" rx="8"/>
  <circle class="cyan" cx="82" cy="1136" r="5"/>
  <text class="tiny" x="98" y="1141">runtime state/data flow</text>
  <circle class="amber" cx="244" cy="1136" r="5"/>
  <text class="tiny" x="260" y="1141">disk persistence</text>
  <circle class="magenta" cx="392" cy="1136" r="5"/>
  <text class="tiny" x="408" y="1141">mutation/test concern</text>
  <circle class="green" cx="568" cy="1136" r="5"/>
  <text class="tiny" x="584" y="1141">development inspection path</text>
</svg>
